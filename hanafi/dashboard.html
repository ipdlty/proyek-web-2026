<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Tim Proyek Web</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS Tambahan -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
  <!-- Konten Aplikasi -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
<div class="container-fluid">
  <div class="row min-vh-100">
    <!-- Sidebar -->
    <aside class="col-md-3 col-lg-2 bg-dark text-white p-3">
      <h4 class="text-center py-2 border-bottom border-secondary">SoftwareHouse App</h4>
      <ul class="nav nav-pills flex-column mt-3">
        <li class="nav-item mb-1"><a href="#" class="nav-link active">Dashboard</a></li>
        <li class="nav-item mb-1"><a href="#" class="nav-link text-white">Data Master</a></li>
        <li class="nav-item mb-1"><a href="#" class="nav-link text-white">Laporan</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Dashboard Overview</h2>
        <span class="badge bg-primary fs-6">Role: Junior Developer</span>
      </div>

      <!-- Ringkasan Statistik (Cards) -->
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <h6 class="text-muted">Total Modul</h6>
            <h3 class="fw-bold mb-0">12</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <h6 class="text-muted">Sprint Berjalan</h6>
            <h3 class="fw-bold text-success mb-0">Sprint 2</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <h6 class="text-muted">Task Pending</h6>
            <h3 class="fw-bold text-warning mb-0">3</h3>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="card border-0 shadow-sm mt-4">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold">Daftar Tugas Tim</h5>
    <button class="btn btn-primary btn-sm">+ Tambah Tugas</button>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>No</th>
            <th>Nama Modul</th>
            <th>PIC</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Desain UI Dashboard</td>
            <td>Ahmad</td>
            <td><span class="badge bg-warning">In Progress</span></td>
            <td>
              <button class="btn btn-sm btn-outline-secondary">Detail</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
